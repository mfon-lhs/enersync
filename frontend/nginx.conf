server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Built files have a new name whenever their content changes, so browsers may keep them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Every other address belongs to the app itself (React Router), so send it index.html.
    # Without this, reloading the page at /assets or /requests would show an nginx "404 Not Found".
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

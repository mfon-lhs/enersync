# Enersync: the database, the API and the web app, started together with one command.
#   docker compose up --build
#
# The values in ${...} come from the .env file next to this one (copy .env.example to .env first).

name: enersync

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-enersync}
    volumes:
      # The database files live in a Docker volume, so they survive restarts
      - enersync-db:/var/lib/postgresql
      # These two files run ONCE, the first time the database is created, in this order
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/demo_data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      # Port 5433 on your computer, so it never clashes with a PostgreSQL you installed yourself (5432).
      # Use it to look inside with pgAdmin: host localhost, port 5433.
      - "127.0.0.1:5433:5432"

  backend:
    build:
      context: ./backend
      args:
        PYTHON_VERSION: "3.12"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker the database is reached by its service name, "db", not by localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enersync}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the .env file}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # The address your BROWSER uses to reach the API
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The API only accepts web pages from http://localhost:5173, so the web app must be served on 5173
      - "5173:80"

volumes:
  enersync-db:
